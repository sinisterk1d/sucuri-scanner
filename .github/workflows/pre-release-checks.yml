name: Pre-release checks

# The gates that stand between a commit and wordpress.org.
#
# These run on every push and pull request so a problem surfaces while it is
# still cheap to fix, and the deploy workflow calls this same file via
# workflow_call so the release is held to exactly the definition that was green
# on the pull request. There is deliberately only one copy of these checks.
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      release-tag:
        description: >-
          Tag being released. When set, the version check also asserts the tag
          matches the plugin version. Empty on push and pull_request.
        required: false
        type: string
        default: ''

jobs:
  # Enforces the project coding standard defined in phpcs.xml.
  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer

      - name: Install dependencies
        run: composer install

      - name: Run coding standards
        run: make lint

  # Guards the two things that only break at release time, when it is too late
  # to take the publish back.
  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Passed through the environment rather than interpolated into the run
      # block, so the tag value can never be expanded as shell source.
      - name: Check version consistency
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: sh tests/check-version-consistency.sh $RELEASE_TAG

      - name: Check distribution manifest
        run: make check-dist

  # Records the state of both dependency trees at publish time. Informational:
  # continue-on-error means a finding here cannot hold the release.
  #
  # This job used to block the deploy, on the reasoning that these packages
  # execute on the runner holding the wordpress.org SVN credentials, so a
  # compromised build dependency would be a credential problem rather than only
  # a broken build. That reasoning does not survive contact with this repository:
  #
  # - Neither tree ships. composer.json requires nothing but php itself, every
  #   other PHP package is require-dev, and the build allowlist in
  #   tests/check-dist-manifest.sh admits no vendor/ and no node_modules/.
  # - The deploy job never runs them. It is a checkout, the 10up deploy action
  #   and the asset upload; none of them invokes composer, npm or node.
  # - Install-time execution, the vector that would actually matter, is already
  #   closed by ignore-scripts=true in .npmrc.
  #
  # An advisory here is still real news about the developer toolchain, because
  # these packages do run on developer machines and on the e2e runner. It just
  # says nothing about whether the artifact being published is safe, and it
  # arrives without anyone touching the code, so blocking on it spends a release
  # at the moment there is least time and no reviewer left to make the call.
  # dependency-audit.yml runs the same commands weekly and files an issue, which
  # is where acting on one belongs.
  #
  # release-tag is empty on push and pull_request, and set only when the deploy
  # workflow calls this one, so this is skipped everywhere except a release.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    if: inputs.release-tag != ''
    continue-on-error: true

    steps:
      - name: Checkout the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer

      - name: Install NodeJS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      # Both read their lock file directly, so neither needs the dependencies
      # to be installed first.
      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Audit Node dependencies
        run: npm audit --audit-level=high
