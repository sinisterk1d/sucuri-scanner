name: Pre-release checks

# The gates that stand between a commit and wordpress.org.
#
# These run on every push and pull request so a problem surfaces while it is
# still cheap to fix, and the deploy workflow calls this same file via
# workflow_call so the release is held to exactly the definition that was green
# on the pull request. There is deliberately only one copy of these checks.
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      release-tag:
        description: >-
          Tag being released. When set, the version check also asserts the tag
          matches the plugin version. Empty on push and pull_request.
        required: false
        type: string
        default: ''

jobs:
  # Enforces the project coding standard defined in phpcs.xml.
  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer

      - name: Install dependencies
        run: composer install

      - name: Run coding standards
        run: make lint

  # Guards the two things that only break at release time, when it is too late
  # to take the publish back.
  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Passed through the environment rather than interpolated into the run
      # block, so the tag value can never be expanded as shell source.
      - name: Check version consistency
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: sh tests/check-version-consistency.sh $RELEASE_TAG

      - name: Check distribution manifest
        run: make check-dist

  # Fails on a known advisory in either dependency tree.
  #
  # None of these packages ship in the plugin, but they execute on developer
  # machines and on the runner that holds the wordpress.org SVN credentials, so
  # a compromised build dependency is a credential problem rather than only a
  # broken build.
  #
  # This job can go red without anyone touching the code, when a new advisory is
  # published against something already in the lock file. That is the intended
  # behaviour: the fix is to update the dependency.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer

      - name: Install NodeJS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      # Both read their lock file directly, so neither needs the dependencies
      # to be installed first.
      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Audit Node dependencies
        run: npm audit --audit-level=high
