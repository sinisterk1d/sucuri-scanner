name: Deploy to WordPress.org

# Triggers the workflow when a new release is published.
on:
  release:
    types: [published]

# Third-party actions are pinned to a commit SHA rather than a tag. A tag is
# mutable and can be repointed by whoever controls the action's repository, and
# this workflow holds the wordpress.org SVN credentials, so a moved tag here is
# a credential-disclosure vector. The trailing comment on each line records the
# human-readable version the SHA corresponds to.
jobs:
  # Runs the same gates every pull request has to pass, plus the release tag
  # check. Publishing cannot be undone: the version number is burned on
  # wordpress.org and the only remedy is another release.
  pre-release-checks:
    name: Pre-release
    uses: ./.github/workflows/pre-release-checks.yml
    with:
      release-tag: ${{ github.event.release.tag_name }}

  # Re-runs the unit suite across the full supported PHP range. The regular unit
  # test workflow is not triggered by a release event, so this is not a
  # duplicate of it.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['7.4', '8.5']

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ matrix.php-version }}
        tools: composer

    - name: Install dependencies
      run: composer install

    - name: Run tests
      run: make unit-test

  # Deploys new releases to wordpress.org.
  #
  # Perform the following steps:
  # - Checks out the repository.
  # - Deploys the plugin to wordpress.org.
  # - Uploads the release assets.

  tag:
    name: New release
    runs-on: ubuntu-latest
    needs: [pre-release-checks, test]

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Deploy plugin to wordpress.org
      id: deploy
      uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
      with:
        generate-zip: true
      env:
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SLUG: 'sucuri-scanner' # WordPress.org plugin's slug

    - name: Upload release asset
      uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SLUG: 'sucuri-scanner' # WordPress.org plugin's slug
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ${{ github.workspace }}/${{ env.SLUG }}.zip
        asset_name: ${{ env.SLUG }}.zip
        asset_content_type: application/zip
